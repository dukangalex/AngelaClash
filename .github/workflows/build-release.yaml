name: Build Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Stable release tag (for example v1.1.0)'
        required: true

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH (for example v1.1.0)." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to move or overwrite it." >&2
            exit 1
          fi
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Convert and set version env
        id: process-version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          VERSION_TAG=${RELEASE_TAG}
          VERSION_TAG=${VERSION_TAG#v}                              # remove the 'v' prefix
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION_TAG"         # split into array
          VERSION_CODE=$(( ${VERSION_PARTS[0]} * 10000 + ${VERSION_PARTS[1]} * 100 + ${VERSION_PARTS[2]} ))
          
          echo "versonName=$VERSION_TAG" >> $GITHUB_OUTPUT          # "1.2.3"
          echo "versonCode=$VERSION_CODE" >> $GITHUB_OUTPUT         # "102003"
      
      - name: Re-write version
        run: |
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${{ steps.process-version.outputs.versonName }}/" version.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${{ steps.process-version.outputs.versonCode }}/" version.properties

      # If any change found, commit it and push
      - name: Commit and push if changes
        run: |
          changes=$(git diff --name-only origin/dev | wc -l)
          if [ $changes -gt 0 ]
          then
            newVersionName=${{ steps.process-version.outputs.versonName }}
            newVersionCode=${{ steps.process-version.outputs.versonCode }}
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add version.properties
            git commit -am "Bump version to $newVersionName ($newVersionCode)"
            git push origin HEAD:dev
          fi

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.process-version.outputs.versonName }}
        run: |
          awk -v version="$RELEASE_VERSION" '
            $0 == "## " version { found = 1; print; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' docs/RELEASE_NOTES.md > release-notes.md
          test -s release-notes.md

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Install release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing secret SIGNING_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing signing secrets" >&2
            exit 1
          fi
          umask 077
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          STORE=$(trim "$SIGNING_STORE_PASSWORD")
          ALIAS=$(trim "$SIGNING_KEY_ALIAS")
          KEY=$(trim "$SIGNING_KEY_PASSWORD")
          printf 'keystore.password=%s\nkey.alias=%s\nkey.password=%s\n' "$STORE" "$ALIAS" "$KEY" > signing.properties
          echo "alias_length=${#ALIAS} store_password_length=${#STORE} key_password_length=${#KEY}"
          if ! keytool -list -keystore release.keystore -storepass "$STORE" -alias "$ALIAS" >/dev/null 2>&1; then
            if keytool -list -keystore release.keystore -storepass "$KEY" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "store password did not open the key; the key password did"
              STORE=$KEY
            else
              echo "neither stored password opens release.keystore" >&2
              exit 1
            fi
          fi
          printf 'keystore.password=%s\nkey.alias=%s\nkey.password=%s\n' "$STORE" "$ALIAS" "$KEY" > signing.properties

      - name: Release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Angela-Clash-android
          path: app/build/outputs/apk/meta/release/*.apk
          if-no-files-found: error

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          tag_name: ${{ inputs.release-tag }}
          name: ${{ steps.process-version.outputs.versonName }}
          target_commitish: dev
          files: app/build/outputs/apk/meta/release/*
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      - name: Notify Telegram channel
        if: ${{ success() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHANNEL_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping channel notification."
            exit 0
          fi
          TG_CHANNEL_ID="$TG_CHANNEL_ID" RELEASE_TAG="$RELEASE_TAG" python3 <<'EOF' > /tmp/tg_payload.json
          import html, json, os
          tag = os.environ["RELEASE_TAG"]
          chat_id = os.environ["TG_CHANNEL_ID"]
          notes = open("release-notes.md", encoding="utf-8").read().strip()
          if len(notes) > 3000:
              notes = notes[:3000].rstrip() + "\n…"
          text = (
              "🎉 <b>Angela Clash " + html.escape(tag) + " 发布</b>\n\n"
              + html.escape(notes)
              + '\n\n<a href="https://github.com/dukangalex/AngelaClash/releases/tag/'
              + html.escape(tag) + '">前往下载</a>'
          )
          print(json.dumps({"chat_id": chat_id, "text": text, "parse_mode": "HTML",
                            "disable_web_page_preview": True}))
          EOF
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data @/tmp/tg_payload.json \
            --fail-with-body
